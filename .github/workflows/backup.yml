name: Database backup
# Daily encrypted backup of the production database, restored into a throwaway database on every run to prove it works.
# Runs only on the schedule or by hand, never on pull requests, so the database secret is never offered to forks.
# Setup and restore steps: testing/BACKUPS.md.
on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST, a quiet hour for students
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-backup
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Secrets are set
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::SUPABASE_DB_URL is not set (see testing/BACKUPS.md)"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::BACKUP_PASSPHRASE is not set (see testing/BACKUPS.md)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - name: Dump and encrypt
        run: bash scripts/backup-db.sh "$RUNNER_TEMP/backup"
      - name: Restore into a throwaway database
        run: bash scripts/restore-check.sh "$(ls "$RUNNER_TEMP"/backup/*.tar.gz.gpg)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/
          retention-days: 30
          if-no-files-found: error
