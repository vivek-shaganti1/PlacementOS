name: Database backup
# Daily encrypted backup of the production database, restored into a throwaway database on every run to prove it works.
# Runs only on the schedule or by hand, never on pull requests, so the database secret is never offered to forks.
# Setup and restore steps: testing/BACKUPS.md.
on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST, a quiet hour for students
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-backup
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
    steps:
      - name: Secrets are set
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::SUPABASE_DB_URL is not set (see testing/BACKUPS.md)"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::BACKUP_PASSPHRASE is not set (see testing/BACKUPS.md)"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - name: Dump and encrypt
        run: bash scripts/backup-db.sh "$RUNNER_TEMP/backup"
      - name: Restore into a throwaway database
        run: bash scripts/restore-check.sh "$(ls "$RUNNER_TEMP"/backup/*.tar.gz.gpg)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/
          retention-days: 30
          if-no-files-found: error
      - name: Copy outside GitHub (S3 or R2, when configured)
        if: ${{ env.BACKUP_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 cp "$RUNNER_TEMP/backup/" "s3://$BACKUP_S3_BUCKET/database/" --recursive --endpoint-url "$BACKUP_S3_ENDPOINT"
      - name: Tell someone when a backup fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label backup-failed --state open --json number -q '.[0].number')
          note="The database backup failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create backup-failed --repo "$GITHUB_REPOSITORY" --color B42318 2>/dev/null || true
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$note"
          else gh issue create --repo "$GITHUB_REPOSITORY" --label backup-failed --title "Database backup is failing" --body "$note"; fi
