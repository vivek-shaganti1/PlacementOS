name: Mobile release
# Run by hand from the Actions tab. Three kinds of release:
#   update  - JavaScript-only changes sent over the air to installed apps (minutes, no store review)
#   build   - a new binary for testers (preview) or for the stores (production)
#   submit  - send the latest production build to App Store Connect and Google Play
# Needs the EXPO_TOKEN secret in the "mobile-release" environment. See docs/MOBILE.md.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: What to release
        type: choice
        options: [update, build, submit]
        required: true
      channel:
        description: Who gets it
        type: choice
        options: [preview, production]
        default: preview
      platform:
        type: choice
        options: [all, ios, android]
        default: all
      message:
        description: What changed (shown in the update list)
        type: string
        default: ''

concurrency:
  group: mobile-release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile-release
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS: npx --yes eas-cli@27.9.0
      CHANNEL: ${{ inputs.channel }}
      PLATFORM: ${{ inputs.platform }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - name: Token is set
        working-directory: .
        run: '[ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN is not set (docs/MOBILE.md)"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Checks before anything ships
        run: |
          npm run typecheck
          (cd .. && node scripts/check-shared.mjs)
      - name: Over-the-air update
        if: inputs.kind == 'update'
        run: $EAS update --channel "$CHANNEL" --platform "$PLATFORM" --message "${MESSAGE:-Update from $GITHUB_SHA}" --non-interactive
      - name: Build
        if: inputs.kind == 'build'
        run: $EAS build --profile "$CHANNEL" --platform "$PLATFORM" --non-interactive --no-wait
      - name: Submit to the stores
        if: inputs.kind == 'submit'
        run: $EAS submit --profile production --platform "$PLATFORM" --latest --non-interactive
