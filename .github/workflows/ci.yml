name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new advisory is seen even when nothing is pushed.
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Entry chunk stays free of three and GSAP
        run: node scripts/check-entry.mjs
      - name: API and ranking tests
        run: npm run test:unit
      - name: Code shared with the mobile app stays pure
        run: npm run check:shared
      - name: Dependency advisories (production, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Development tool advisories (reported, not blocking)
        run: npm audit --audit-level=high || echo "::warning::Development dependencies have high advisories"
        continue-on-error: true

  mobile:
    name: mobile (typecheck, doctor, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck (includes the code shared with the website)
        run: npm run typecheck
      - name: Expo doctor
        run: npx --yes expo-doctor@1.21.8
      - name: Bundle for iOS and Android
        run: npm run bundle

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Replay migrations and run access tests
        run: bash scripts/test-db.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
