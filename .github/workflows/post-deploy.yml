name: Post-deploy check
# Runs when Vercel reports a successful production deployment, and on demand. Read-only checks of the live site:
# pages, headers, health, the database probe, sign-up off, anonymous reads refused, API routes need a session.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Smoke-test production
        run: node scripts/smoke-live.mjs https://placementiq-os.vercel.app
