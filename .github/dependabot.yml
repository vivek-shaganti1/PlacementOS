# Keeps pinned GitHub Actions and npm packages current. Security fixes also arrive on their own, outside this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates of everything arrive as one pull request; majors stay separate so each is reviewed.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # three and its typings move together with @react-three/*; upgrade those by hand.
      - dependency-name: three
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/three'
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: 'deps'
