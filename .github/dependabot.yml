# Keeps pinned GitHub Actions and npm packages current. Security fixes also arrive on their own, outside this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # New releases wait a week before being proposed: a hijacked package is usually caught and pulled within days.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /mobile
    # New releases wait a week before being proposed: a hijacked package is usually caught and pulled within days.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    groups:
      # Expo packages move together with the SDK; upgrade those with `npx expo install --fix`, not one by one.
      mobile-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'expo*'
      - dependency-name: 'react-native*'
      - dependency-name: react
      - dependency-name: react-dom
    commit-message:
      prefix: 'deps(mobile)'

  - package-ecosystem: npm
    directory: /
    # New releases wait a week before being proposed: a hijacked package is usually caught and pulled within days.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates of everything arrive as one pull request; majors stay separate so each is reviewed.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # three and its typings move together with @react-three/*; upgrade those by hand.
      - dependency-name: three
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/three'
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: 'deps'
