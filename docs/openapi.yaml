openapi: 3.0.3
info:
  title: PlacementIQ API
  version: 0.1.0
  description: 'The functions in api/. Used only by the PlacementIQ apps. Every response carries x-request-id; errors are JSON with an error field.'
servers:
  - url: http://127.0.0.1:4173
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
paths:
  /api/account:
    post:
      summary: Delete your own student account (student)
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {"action": "delete", "confirm_email": "you@college.edu"}
      responses:
        '200':
          description: Done
        '401':
          description: Not signed in
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
  /api/admin:
    post:
      summary: Add students, recruiters or admins (admin (two-factor))
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {"action": "invite", "org_id": "00000000-0000-0000-0000-000000000000", "role": "student", "people": [{"email": "s@college.edu"}]}
      responses:
        '200':
          description: Done
        '401':
          description: Not signed in
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
  /api/chat:
    post:
      summary: Ask the career assistant (student)
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {"messages": [{"role": "user", "text": "What should I fix first?"}]}
      responses:
        '200':
          description: Done
        '401':
          description: Not signed in
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
  /api/connect:
    post:
      summary: Connect an evidence account or credential (student)
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {"platform": "github", "username": "octocat"}
      responses:
        '200':
          description: Done
        '401':
          description: Not signed in
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
  /api/contact:
    post:
      summary: Send a message from the public site
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {"name": "Dr. Rao", "college": "Test College", "email": "rao@example.test", "message": "We have 900 students."}
      responses:
        '200':
          description: Done
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
  /api/health:
    get:
      summary: Is the service up
      responses:
        '200':
          description: Done
        '503':
          description: Not available right now
  /api/openings:
    get:
      summary: Open roles at a company, or an off-campus search (signed in)
      security:
        - bearer: []
      parameters:
        - name: company
          in: query
          schema:
            type: string
          example: deloitte
        - name: q
          in: query
          schema:
            type: string
          example: data analyst
        - name: where
          in: query
          schema:
            type: string
          example: Pune
        - name: status
          in: query
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Done
        '401':
          description: Not signed in
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
  /api/password:
    post:
      summary: Replace a temporary password (signed in)
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {"password": "a-long-password"}
      responses:
        '200':
          description: Done
        '401':
          description: Not signed in
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
  /api/resume:
    post:
      summary: Analyse, clear or match your resume (student)
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {"action": "clear"}
      responses:
        '200':
          description: Done
        '401':
          description: Not signed in
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
  /api/signup:
    post:
      summary: Ask for a registration link
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {"email": "s@college.edu", "roll_number": "22ABC001"}
      responses:
        '200':
          description: Done
        '422':
          description: Something in the request is not valid
        '429':
          description: Too many requests
        '503':
          description: Not available right now
