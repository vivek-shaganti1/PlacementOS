        <h1>PlacementIQ: placement season, decoded</h1>
        <p>PlacementIQ is a campus placement platform for students, placement cells and recruiters. It scores a student's real profile against every campus recruiter, reads resumes like an applicant tracking system, syncs coding platforms and shows the one thing to fix next for each company.</p>
        <ul>
          <li>Students see where they stand with each recruiter and why.</li>
          <li>Placement cells run drives and rosters for their own college.</li>
          <li>Recruiters see only the applicants to their own drives.</li>
        </ul>
